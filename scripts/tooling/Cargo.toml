[package]
name = "onionall-tooling"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
ctrlc = { version = "=3.5.1", features = ["termination"] }
getrandom = "=0.3.4"
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tempfile = "=3.24.0"
time = { version = "=0.3.47", features = ["parsing"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", features = ["user"] }

[dev-dependencies]
time = { version = "=0.3.47", features = ["formatting", "macros"] }

[lints.rust]
unsafe_code = "forbid"
