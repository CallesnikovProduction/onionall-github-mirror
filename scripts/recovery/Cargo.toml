[package]
name = "onionall-recovery"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
ctrlc = { version = "=3.5.1", features = ["termination"] }
serde_json = "=1.0.149"
tempfile = "=3.24.0"
time = { version = "=0.3.47", features = ["formatting"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", features = ["user"] }

[lints.rust]
unsafe_code = "forbid"
