<h1>RocksDB write-ahead log</h1>
<h2>Recovery</h2>
<p>The write-ahead log records updates before memtables are flushed.</p>
<h2>Write options</h2>
<p>Set <code>WriteOptions.disableWAL</code> to true to disable logging for those writes.</p>
