# Controlled synthetic test only. M0 remains unchanged.
services:
  frontier-init:
    image: crawlercommons/url-frontier:2.4
    pull_policy: ${M1_PULL_POLICY:-missing}
    user: "0:0"
    # Normalize a copy: bind mounts may come from a Windows CRLF checkout.
    entrypoint:
      - /bin/sh
      - -ec
      - tr -d '\r' < /tests/frontier-volume-init.sh > /tmp/frontier-volume-init.sh; exec /bin/sh /tmp/frontier-volume-init.sh
    volumes:
      - frontier-data:/crawldir
      - ./scripts/frontier-volume-init.sh:/tests/frontier-volume-init.sh:ro
    network_mode: none

  frontier:
    image: crawlercommons/url-frontier:2.4
    pull_policy: ${M1_PULL_POLICY:-missing}
    command: ["rocksdb.path=/crawldir/rocksdb"]
    depends_on:
      frontier-init:
        condition: service_completed_successfully
    volumes:
      - frontier-data:/crawldir
    networks: [controlled]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/bin/bash", "-ec", ": > /dev/tcp/127.0.0.1/7071"]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 20

  fixture:
    image: python:3.12-slim
    pull_policy: ${M1_PULL_POLICY:-missing}
    command: ["python", "-u", "/tests/fixture.py", "--log", "/evidence/requests.jsonl"]
    volumes:
      - ./test/m1:/tests:ro
      - ${M1_RUN_DIR:?Use scripts/run-controlled-crawl.sh or scripts/run-controlled-crawl.ps1}:/evidence
    networks:
      controlled:
        ipv4_address: 172.30.71.10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://localhost:8080/health', timeout=2).read() == b'ready'"]
      interval: 2s
      timeout: 3s
      retries: 20

  crawler:
    image: ${M1_STORM_IMAGE:-storm:3.1.0-jre25}
    pull_policy: ${M1_PULL_POLICY:-missing}
    profiles: [tools]
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    environment:
      M1_RUN_REL: ${M1_RUN_REL:?Use scripts/run-controlled-crawl.sh or scripts/run-controlled-crawl.ps1}
    entrypoint:
      - /bin/sh
      - -ec
      - tr -d '\r' < /workspace/scripts/run-controlled-crawl-container.sh > /tmp/m1-container.sh; exec /bin/bash /tmp/m1-container.sh
    networks: [controlled]
    stop_grace_period: 60s

  probe:
    image: ${M1_STORM_IMAGE:-storm:3.1.0-jre25}
    pull_policy: ${M1_PULL_POLICY:-missing}
    profiles: [tools]
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - ${M1_RUN_DIR:?Use scripts/run-controlled-crawl.sh or scripts/run-controlled-crawl.ps1}:/evidence
    entrypoint: ["java", "-cp", "/apache-storm/lib/*:/apache-storm/lib-common/*:/evidence/crawler-m1.jar", "dev.onionall.brawler.m1.FrontierProbe"]
    networks: [controlled]

volumes:
  frontier-data:

networks:
  controlled:
    internal: true
    ipam:
      config:
        - subnet: 172.30.71.0/24
