name: Verification (not product acceptance)
on:
  push:
    branches: [feat/m5-operational-closure]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      M1_HTTP_SMOKE: '1'
      URLFRONTIER_BASE_JAR: ${{ github.workspace }}/.runtime/ci/urlfrontier-service.jar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Recover pinned Frontier base (no container execution)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/ci
          image='crawlercommons/url-frontier@sha256:8fd86c533163bfbcd98006bf8523efe731eea82a87dfe8db1df32a93d1973453'
          docker pull --platform linux/amd64 "$image"
          fixture=$(docker create --platform linux/amd64 "$image")
          docker cp "$fixture:/home/urlfrontier/urlfrontier-service.jar" "$URLFRONTIER_BASE_JAR"
          printf '%s  %s\n' ff1b774bf81343234e6f34878f8b7c9a826371b3e305e96bf0e204895e3562df "$URLFRONTIER_BASE_JAR" | sha256sum --check
      - name: Verify JVM, Python, Frontier and local links
        run: python -B scripts/runners/verify.py
      # Default runner deliberately remains non-green while product E2E is NOT RUN.
      # Docker product E2E needs the paired application/server/Storm assembly (DEV-02).
      # No real Tor, external onion fixture or privileged host configuration here.
      - name: Retain actual results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-evidence
          path: .runtime/verification/
          if-no-files-found: warn
